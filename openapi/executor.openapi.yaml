openapi: 3.1.0
info:
  title: executor_docker_openhands health probes
  version: 0.48.0
  description: >-
    The only HTTP surface of the Docker OpenHands Executor: two platform
    health probes on executor_api_bind (default 127.0.0.1:8020). Every other
    path answers 404 or 405. Work arrives over NATS JetStream, never over
    HTTP.
paths:
  /v1/livez:
    get:
      operationId: getLivez
      summary: Liveness; 200 while the process runs.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /v1/readyz:
    get:
      operationId: getReadyz
      summary: Readiness; 200 only when the Executor takes work.
      responses:
        "200":
          description: >-
            Connected to the broker with a valid JWT, the command consumer
            exists, no connection loss, and the container runtime is
            supervised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; the flags say why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
components:
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          const: ok
        executor_id:
          type: integer
          minimum: 1
          description: From the JWT; absent before the Executor read it.
        service:
          const: executor_docker_openhands
    Readiness:
      type: object
      additionalProperties: false
      required:
        [status, service, broker_connected, connection_loss, can_supervise]
      properties:
        status:
          enum: [ready, not_ready]
        executor_id:
          type: integer
          minimum: 1
        service:
          const: executor_docker_openhands
        broker_connected:
          type: boolean
          description: Connected with a valid JWT and the command consumer exists.
        connection_loss:
          type: boolean
          description: Heartbeats failed miss_limit times or the JWT was revoked.
        can_supervise:
          type: boolean
          description: The Docker events stream is up.
