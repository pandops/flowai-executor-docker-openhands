name: Qualify Docker OpenHands Executor

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected Docker OpenHands Executor ref
        type: string
        required: true
      env_registry_sha:
        description: Full publisher commit SHA of env-registry
        type: string
        required: true
      executor_registry_sha:
        description: Full publisher commit SHA of executor-registry
        type: string
        required: true
      model_registry_sha:
        description: Full publisher commit SHA of model-registry
        type: string
        required: true
      task_manager_sha:
        description: Full publisher commit SHA of task-manager
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      ENV_REGISTRY_SHA: ${{ inputs.env_registry_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      MODEL_REGISTRY_SHA: ${{ inputs.model_registry_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA ENV_REGISTRY_SHA EXECUTOR_REGISTRY_SHA MODEL_REGISTRY_SHA TASK_MANAGER_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$RUNNER_TEMP/docker-openhands-contracts"
          mkdir "$contracts"
          mkdir -p "$contracts/qa-e2e/scripts"
          git show "$source_sha:qualification/schema-declarations.json" > "$contracts/qa-e2e/scripts/shared-test-inputs.json"

          fetch_schema() {
            local repo="$1" sha="$2" root="$3" file="$4" status
            local url="https://raw.githubusercontent.com/pandops/$repo/${sha,,}/schemas/$file"
            local output="$root/schemas/$file"
            jq -e --arg path "$output" '.schemas | has($path)' "$contracts/qa-e2e/scripts/shared-test-inputs.json" > /dev/null
            mkdir -p "$contracts/$root/schemas"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            jq -e 'type == "object"' "$contracts/$output" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$output")
          }

          for file in error.reply.schema.json executor.launch-parameters-open.reply.schema.json; do
            fetch_schema flowai-env-registry "$ENV_REGISTRY_SHA" svc/env-registry "$file"
          done
          for file in error.reply.schema.json executor.heartbeat.reply.schema.json executor.heartbeat.request.schema.json; do
            fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry "$file"
          done
          for file in defs.schema.json edge.litellm-key.reply.schema.json executor.check.reply.schema.json executor.check.request.schema.json; do
            fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry "$file"
          done
          for file in command.schema.json defs.schema.json executor.claim-token.reply.schema.json executor.claim-token.request.schema.json task.schema.json; do
            fetch_schema flowai-task-manager "$TASK_MANAGER_SHA" svc/task-manager "$file"
          done
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./... 2>&1 | tee "$RUNNER_TEMP/qualification-unit.log"

      - name: Require public cleanup fixture
        shell: bash
        run: |
          # Set this literal only after an approved public fixture digest is verified.
          fixture='ghcr.io/openhands/agent-server@sha256:0afca19fde9455b003d3b58e17d461d3fbe406a1c3aba7fbfe55ffac82851b21'
          if [[ ! "$fixture" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Hosted qualification pending an approved public Docker cleanup fixture pinned by digest.' >&2
            exit 1
          fi
          docker pull --platform linux/amd64 "$fixture"
          printf 'FLOWAI_OPENHANDS_TEST_IMAGE=%s\n' "$fixture" >> "$GITHUB_ENV"

      - name: Runtime integration tests
        shell: bash
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          go test -mod=readonly -count=1 -tags=integration -v ./... 2>&1 | tee "$RUNNER_TEMP/qualification-integration.log"

      - name: Build local Linux image
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/docker-openhands.iid" . 2>&1 | tee "$RUNNER_TEMP/qualification-build.log"
          cat "$RUNNER_TEMP/docker-openhands.iid"

      - name: Verify and package the qualified OCI image
        shell: bash
        env:
          QUALIFICATION_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          [[ "$(skopeo --version)" == 'skopeo version 1.13.3' ]]
          [[ "$(jq --version)" == 'jq-1.7' ]]
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          workflow_sha="$(sha256sum .github/workflows/qualify.yml | cut -d ' ' -f1)"
          image_id="$(cat "$RUNNER_TEMP/docker-openhands.iid")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect --format '{{ .Id }}' "$image_id")" == "$image_id" ]]
          layout="$RUNNER_TEMP/qualified-oci-layout"
          skopeo copy --format oci "docker-daemon:$image_id" "oci:$layout:qualified"
          manifest="$(jq -er '
            select(.schemaVersion == 2 and (.manifests | length) == 1)
            | .manifests[0]
            | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
            | .digest | select(test("^sha256:[a-f0-9]{64}$"))
          ' "$layout/index.json")"
          cd "$layout"
          manifest_path="blobs/sha256/${manifest#sha256:}"
          printf '%s  %s\n' "${manifest#sha256:}" "$manifest_path" | sha256sum --check
          config="$(jq -er '.config.digest | select(test("^sha256:[a-f0-9]{64}$"))' "$manifest_path")"
          skopeo inspect --config "docker-daemon:$image_id" | jq -cS . > "$RUNNER_TEMP/source-oci-config.json"
          jq -cS . "blobs/sha256/${config#sha256:}" | cmp "$RUNNER_TEMP/source-oci-config.json" -
          jq -er '
            [.config, .layers[]][].digest
            | if test("^sha256:[a-f0-9]{64}$") then sub("^sha256:"; "") else error("invalid OCI digest") end
            | "\(.)  blobs/sha256/\(.)"
          ' "$manifest_path" | sha256sum --check
          jq -e '.os == "linux" and .architecture == "amd64"' "blobs/sha256/${config#sha256:}" >/dev/null

          artifact="$RUNNER_TEMP/qualified-oci"
          mkdir "$artifact"
          tar -cf "$artifact/image.oci.tar" oci-layout index.json blobs
          mv "$RUNNER_TEMP"/qualification-{unit,integration,build}.log "$artifact/"
          cd "$artifact"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
            --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sourceTree "$source_tree" --arg workflowSha "$workflow_sha" --argjson inputs "$QUALIFICATION_INPUTS" \
            --arg imageId "$image_id" --arg manifest "$manifest" --arg config "$config" \
            '{repository:$repository,ref:$ref,source:$source,run:$run,attempt:$attempt,sourceTree:$sourceTree,workflowSha256:$workflowSha,inputs:$inputs,imageId:$imageId,manifest:$manifest,config:$config}' > receipt.json
          sha256sum image.oci.tar receipt.json qualification-{unit,integration,build}.log > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload qualified OCI archive
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-oci/image.oci.tar
            ${{ runner.temp }}/qualified-oci/receipt.json
            ${{ runner.temp }}/qualified-oci/SHA256SUMS
            ${{ runner.temp }}/qualified-oci/qualification-unit.log
            ${{ runner.temp }}/qualified-oci/qualification-integration.log
            ${{ runner.temp }}/qualified-oci/qualification-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
