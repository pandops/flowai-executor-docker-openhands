name: Qualify Docker OpenHands Executor

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected Docker OpenHands Executor ref
        type: string
        required: true
      env_registry_sha:
        description: Full publisher commit SHA of env-registry
        type: string
        required: true
      executor_registry_sha:
        description: Full publisher commit SHA of executor-registry
        type: string
        required: true
      model_registry_sha:
        description: Full publisher commit SHA of model-registry
        type: string
        required: true
      task_manager_sha:
        description: Full publisher commit SHA of task-manager
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      ENV_REGISTRY_SHA: ${{ inputs.env_registry_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      MODEL_REGISTRY_SHA: ${{ inputs.model_registry_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA ENV_REGISTRY_SHA EXECUTOR_REGISTRY_SHA MODEL_REGISTRY_SHA TASK_MANAGER_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$RUNNER_TEMP/docker-openhands-contracts"
          mkdir "$contracts"
          mkdir -p "$contracts/qa-e2e/scripts"
          git show "$source_sha:qualification/schema-declarations.json" > "$contracts/qa-e2e/scripts/shared-test-inputs.json"

          fetch_schema() {
            local repo="$1" sha="$2" root="$3" file="$4" status
            local url="https://raw.githubusercontent.com/pandops/$repo/${sha,,}/schemas/$file"
            local output="$root/schemas/$file"
            jq -e --arg path "$output" '.schemas | has($path)' "$contracts/qa-e2e/scripts/shared-test-inputs.json" > /dev/null
            mkdir -p "$contracts/$root/schemas"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            jq -e 'type == "object"' "$contracts/$output" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$output")
          }

          for file in error.reply.schema.json executor.launch-parameters-open.reply.schema.json; do
            fetch_schema flowai-env-registry "$ENV_REGISTRY_SHA" svc/env-registry "$file"
          done
          for file in error.reply.schema.json executor.heartbeat.reply.schema.json executor.heartbeat.request.schema.json; do
            fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry "$file"
          done
          for file in defs.schema.json edge.litellm-key.reply.schema.json executor.check.reply.schema.json executor.check.request.schema.json; do
            fetch_schema flowai-model-registry "$MODEL_REGISTRY_SHA" svc/model-registry "$file"
          done
          for file in command.schema.json defs.schema.json executor.claim-token.reply.schema.json executor.claim-token.request.schema.json task.schema.json; do
            fetch_schema flowai-task-manager "$TASK_MANAGER_SHA" svc/task-manager "$file"
          done
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: Require public cleanup fixture
        shell: bash
        run: |
          # Set this literal only after an approved public fixture digest is verified.
          fixture='ghcr.io/openhands/agent-server@sha256:0afca19fde9455b003d3b58e17d461d3fbe406a1c3aba7fbfe55ffac82851b21'
          if [[ ! "$fixture" =~ ^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo 'Hosted qualification pending an approved public Docker cleanup fixture pinned by digest.' >&2
            exit 1
          fi
          docker pull --platform linux/amd64 "$fixture"
          printf 'FLOWAI_OPENHANDS_TEST_IMAGE=%s\n' "$fixture" >> "$GITHUB_ENV"

      - name: Runtime integration tests
        shell: bash
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          go test -mod=readonly -count=1 -tags=integration -v ./...

      - name: Build local Linux image
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/docker-openhands.iid" .
          cat "$RUNNER_TEMP/docker-openhands.iid"
